spring:
  application:
    name: documind-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # Hard framework caps. The real limit is app.documents.max-size below.
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: documind
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  documents:
    max-size: ${MAX_UPLOAD_SIZE:4MB}
    max-pages: 300
    chunk-max-tokens: 800
    chunk-overlap-tokens: 100
  rag:
    top-k: 6
    generation-model: ${GEMINI_GENERATION_MODEL:gemini-3.5-flash}
    thinking-level: ${GEMINI_THINKING_LEVEL:low}
    max-output-tokens: 4096
    snippet-length: 400
    generation-timeout: 60s
    generation-max-retries: 2
    generation-backoff: 3s
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    embedding-model: gemini-embedding-001
    embedding-dimensions: 768
    batch-size: 10
    batch-delay: 3s
    max-retries: 6
    initial-backoff: 10s
    request-timeout: 60s
